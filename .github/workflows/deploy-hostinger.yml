name: Deploy backend to Hostinger

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-hostinger.yml'
      - 'php/**'
      - 'config/**'
      - 'css/**'
      - 'img/**'
      - 'imgnuevas/**'
      - 'includes/**'
      - 'bd/**'
      - 'index.php'
      - 'vercel.json'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        timeout-minutes: 10
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          protocol: ftp
          port: 21
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          server-dir: ${{ secrets.HOSTINGER_FTP_REMOTE_DIR }}
          local-dir: ./
          timeout: 120000
          log-level: verbose
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.github/**
            frontend/**
            node_modules/**
            .vscode/**
            config/conexion.php
            config/openai.local.php
            README.md
            *.md
            *.log
            *.zip
            package-lock.json
            **/.DS_Store
